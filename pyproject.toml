[project]
name = "kaki-agent"
version = "0.1.0"
description = "A local Python coding agent with durable sessions and bounded context"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
  "openai>=2.24,<3", "textual>=1,<9", "typer>=0.20,<1",
  "pydantic>=2.12,<3", "jsonschema>=4,<5", "tiktoken>=0.12,<1",
  "mcp>=1.28,<2", "pyyaml>=6,<7", "httpx>=0.28,<1", "pillow>=12,<13",
]

[project.optional-dependencies]
dev = ["pytest>=9,<10", "pytest-asyncio>=1,<2", "ruff>=0.14,<1"]

[project.scripts]
kaki-agent = "kaki.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kaki"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.ruff.format]
# Source excerpts retain original indentation and line references in the manual.
exclude = ["docs/**/*.md"]
