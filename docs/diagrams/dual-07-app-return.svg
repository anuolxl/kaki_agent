idth="590" height="110" rx="16" fill="#F1F6FD" stroke="#8EAED8" stroke-width="2"/><text x="640.0" y="1549.0" text-anchor="middle" font-size="22" font-weight="600" fill="#20324A">renderTranscript / updateStatus</text><text x="640.0" y="1576.0" text-anchor="middle" font-size="22" font-weight="600" fill="#20324A">外层Task结束后解除busy</text><rect x="960" y="510" width="290" height="120" rx="16" fill="#F4F0FC" stroke="#AB98D2" stroke-width="2"/><text x="1105.0" y="564.0" text-anchor="middle" font-size="22" font-weight="600" fill="#20324A">_execute finally</text><text x="1105.0" y="591.0" text-anchor="middle" font-size="22" font-weight="600" fill="#20324A">清空外层Task</text></svg>