<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1510" viewBox="0 0 1280 1510" font-family="PingFang SC, Arial Unicode MS, sans-serif"><rect x="0" y="0" width="1280" height="100%" fill="#ffffff"/><rect x="24" y="24" width="8" height="65" rx="4" fill="#DF8256"/><text x="52" y="52" font-size="28" font-weight="700" fill="#20324A">G03 · TUI接单、命令与问答分流</text><text x="52" y="81" font-size="17" fill="#63758C">普通任务在Runtime.submit汇合；watch_turn只观察已创建Task，不启动推理循环</text><text x="52" y="110" font-size="16" fill="#3265B3">C 控制调用/下一执行步骤（实线）</text><text x="540" y="110" font-size="16" fill="#16816D">D 返回值/事件数据（虚线）</text><polyline points="640.0,245 640.0,335" fill="none" stroke="#3265B3" stroke-width="2.8" stroke-linejoin="round"/><polygon points="640.0,335 645.0,323.0 635.0,323.0" fill="#3265B3"/><rect x="624.0" y="275.0" width="32" height="25" rx="5" fill="white"/><text x="640.0" y="293.0" text-anchor="middle" font-size="16" fill="#3265B3">C1</text><polyline points="505,392.5 205,392 205.0,540" fill="none" stroke="#3265B3" stroke-width="2.8" stroke-linejoin="round"/><polygon points="205.0,540 210.0,528.0 200.0,528.0" fill="#3265B3"/><rect x="272.0" y="405" width="56" height="25" rx="5" fill="white"/><text x="300" y="423" text-anchor="middle" font-size="16" fill="#3265B3">C2 是</text><polyline points="205.0,650 205.0,755" fill="none" stroke="#16816D" stroke-width="2.8" stroke-linejoin="round" stroke-dasharray="9 6"/><polygon points="205.0,755 210.0,743.0 200.0,743.0" fill="#16816D"/><rect x="153.0" y="687.5" width="104" height="25" rx="5" fill="white"/><text x="205.0" y="705.5" text-anchor="middle" font-size="16" fill="#16816D">D1 回答文本</text><polyline points="640.0,450 640,500 875,500 875.0,540" fill="none" stroke="#3265B3" stroke-width="2.8" stroke-linejoin="round"/><polygon points="875.0,540 880.0,528.0 870.0,528.0" fill="#3265B3"/><rect x="847.0" y="505.0" width="56" height="25" rx="5" fill="white"/><text x="875.0" y="523.0" text-anchor="middle" font-size="16" fill="#32