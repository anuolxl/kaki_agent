<text x="60" y="692" font-size="23" fill="#475569" font-family="Arial, PingFang SC, sans-serif">on_start 先 mark_running；completed 先 commit_tool；execute_many 返回后，窗口按调用序回填。</text><text x="60" y="733" font-size="23" fill="#475569" font-family="Arial, PingFang SC, sans-serif">UNKNOWN / cancelled 由终止/恢复对账产生，不是工具直接执行结果；仅安全 READ 可并行，每批最多 4。</text></svg>