  <text x="780.0" y="257" text-anchor="middle" font-size="23" fill="#334155" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif">每轮窗口预算 + 有界迭代</text>
  <path d="M 1125 170 H 1445 L 1470 238.0 L 1445 306 H 1125 L 1100 238.0 Z" fill="#e0e7ff" stroke="#4f46e5" stroke-width="2" />
  <text x="1285.0" y="209" text-anchor="middle" font-size="27" font-weight="600" fill="#0f172a" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif">Provider.complete</text>
  <text x="1285.0" y="257" text-anchor="middle" font-size="21" fill="#334155" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif">kind=main；增量先发 model.delta</text>
  <rect x="1100" y="478" width="370" height="136" rx="22" fill="#ecfdf5" stroke="#059669" stroke-width="2" />
