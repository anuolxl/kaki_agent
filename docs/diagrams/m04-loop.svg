  <text x="1285.0" y="565" text-anchor="middle" font-size="23" fill="#334155" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif">tools / 正文 / 空 / 截断</text>
  <rect x="595" y="478" width="370" height="136" rx="22" fill="#fef3c7" stroke="#d97706" stroke-width="2" />
  <text x="780.0" y="517" text-anchor="middle" font-size="27" font-weight="600" fill="#0f172a" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif">commit_model → 工具</text>
  <text x="780.0" y="565" text-anchor="middle" font-size="23" fill="#334155" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif">先落库再执行；逐个提交结果</text>
  <path d="M 90 503 Q 275.0 460 460 503 L 460 596 Q 275.0 639 90 596 Z" fill="#e2e8f0" stroke="#475569" stroke-width="2" />
  <text x="275.0" y="517" text-anchor="middle" font-size="27" font-weight="600" fill="#0f172a" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif">当前窗口 / 迭代状态</text>
  <text x="275.0" y="565" text-anchor="middle" font-size="23" fill="#334155" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif">批量返回后按序追加已提交观测</text>
  <text x="527.5" y="194" font-size="23" fill="#047857" font-weight="600" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="middle">D3</text>
  <text x="527.5" y="221" font-size="21" fill="#047857" font-weight="400" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="middle">初始窗口</text>
  <text x="1032.5" y="194" font-size="23" fill="#0369a1" font-weight="600" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="middle">C2</text>
  <text x="1032.5" y="221" font-size="21" fill="#0369a1" font-weight="400" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="middle">请求模型</text>
  <text x="1305" y="390" font-size="23" fill="#047857" font-weight="600" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="start">D1</text>
  <text x="1305" y="417" font-size="21" fill="#047857" font-weight="400" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="start">完整响应</text>
  <text x="1065" y="492" font-size="23" fill="#0369a1" font-weight="600" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="middle">C3</text>
  <text x="1065" y="519" font-size="21" fill="#0369a1" font-weight="400" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="middle">有工具</text>
  <text x="527.5" y="492" font-size="23" fill="#047857" font-weight="600" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="middle">D2</text>
  <text x="527.5" y="519" font-size="21" fill="#047857" font-weight="400" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="middle">已提交观测</text>
  <text x="335" y="368" font-size="23" fill="#0369a1" font-weight="600" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="start">C1 continue：下一轮预算检查</text>
  <text x="1030" y="375" font-size="23" fill="#0369a1" font-weight="600" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="start">C4</text>
  <text x="1030" y="402" font-size="21" fill="#0369a1" font-weight="400" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="start">空正文恢复</text>
  <text x="770" y="132" font-size="22" fill="#0369a1" font-weight="500" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="start">C5 overflow 且无 partial：可裁剪时重试 ≤2</text>
  <text x="60" y="690" font-size="22" fill="#475569" font-weight="400" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="start">正常正文：commit_model 后返回 completed / final_answer；输出截断：返回 interrupted / output_limit。</text>
  <text x="60" y="738" font-size="22" fill="#475569" font-weight="400" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="start">迭代耗尽：tools=None 收尾或本地 fallback，提交消息后仍返回 interrupted / iteration_limit。</text>
  <text x="60" y="786" font-size="22" fill="#475569" font-weight="400" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="start">空回复恢复有界；回环只回 rebalance，不重新 assemble；每个真实工具结果立即提交。</text>
  <text x="60" y="834" font-size="22" fill="#475569" font-weight="400" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="start">取消或不可恢复异常直接抛给 Runtime；终态由 Runtime 发布，Loop 不发 turn.finished。</text>
</svg>
