<text x="60" y="692" font-size="23" fill="#475569" font-family="Arial, PingFang SC, sans-serif">召回先按 workspace_id + user_id + active 过滤，再做 BM25 TopK（默认5、可配置）；同作用域可跨会话使用。</text><text x="60" y="733" font-size="23" fill="#475569" font-family="Arial, PingFang SC, sans-serif">kaki_remember 仅新增/替代；Store.retract 另置 retracted，旧内容保留；记忆不能替代当前用户授权。</text></svg>