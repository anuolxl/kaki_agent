<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1910" viewBox="0 0 1280 1910" font-family="PingFang SC, Arial Unicode MS, sans-serif"><rect x="0" y="0" width="1280" height="100%" fill="#ffffff"/><rect x="24" y="24" width="8" height="65" rx="4" fill="#DF8256"/><text x="52" y="52" font-size="28" font-weight="700" fill="#20324A">G03b · submit创建任务，watch等待，执行路径发送事件</text><text x="52" y="81" font-size="17" fill="#63758C">沿左侧执行Task；右上Worker等待同一Task，右下消费者持续显示事件</text><text x="52" y="110" font-size="16" fill="#3265B3">C 控制调用/下一执行步骤（实线）</text><text x="540" y="110" font-size="16" fill="#16816D">D 返回值/事件数据（虚线）</text><polyline points="325.0,265 325.0,385" fill="none" stroke="#3265B3" stroke-width="2.8" stroke-linejoin="round"/><polygon points="325.0,385 330.0,373.0 320.0,373.0" fill="#3265B3"/><rect x="273.0" y="310.0" width="104" height="25" rx="5" fill="white"/><text x="325.0" y="328.0" text-anchor="middle" font-size="16" fill="#3265B3">C1 同步调用</text><polyline points="325.0,495 325.0,615" fill="none" stroke="#3265B3" stroke-width="2.8" stroke-linejoin="round"/><polygon points="325.0,615 330.0,603.0 320.0,603.0" fill="#3265B3"/><rect x="273.0" y="540.0" width="104" height="25" rx="5" fill="white"/><text x="325.0" y="558.0" text-anchor="middle" font-size="16" fill="#3265B3">C2 调度协程</text><polyline points="610,210.0 1035,210 1035,560 1035.0,615" fill="none" stroke="#3265B3" stroke-width="2.8" stroke-linejoin="round"/><polygon points="1035.0,615 1040.0,603.0 1030.0,603.0" fill="#3265B3"/><rect x="963.0" y="455" width="144" height="25" rx="5" fill="white"/><text x="1035" y="473" text-anchor="middle" font-size="16" fill="#3265B3">C3 调用@work方法</text><polyline points="610,440.0 720,440 720,685 830,685.0" fill="none" stroke="#16816D" stroke-width="2.8" stroke-linejoin="round" stroke-dasharray="9 6"/><polygon points="830,685.0 818.0,680.0 818.0,690.0" fill="#16816D"/><rect x="644.0" y="535" width="152" height="25" rx="5" fill="white"/><text x="720" y="553" text-anchor="middle" font-size="16" fill="#16816D">D1 同一个Task句柄</text><polyline points="325.0,725 325.0,850" fill="none" stroke="#3265B3" stroke-width="2.8" stroke-linejoin="round"/><polygon points="325.0,850 330.0,838.0 320.0,838.0" fill="#3265B3"/><rect x="253.0" y="772.5" width="144" height="25" rx="5" fill="white"/><text x="325.0" y="790.5" text-anchor="middle" font-size="16" fill="#3265B3">C4 _turn开始执行</text><polyline points="325.0,960 325.0,1080" fill="none" stroke="#3265B3" stroke-width="2.8" stroke-linejoin="round"/><polygon points="325.0,1080 330.0,1068.0 320.0,1068.0" fill="#3265B3"/><rect x="257.0" y="1005.0" width="136" height="25" rx="5" fill="white"/><text x="325.0" y="1023.0" text-anchor="middle" font-size="16" fill="#3265B3">C5 created=True</text><polyline points="325.0,1190 325.0,1320" fill="none" stroke="#3265B3" stroke-width="2.8" stroke-linejoin="round"/><polygon points="325.0,1320 330.0,1308.0 320.0,1308.0" fill="#3265B3"/><rect x="249.0" y="1240.0" width="152" height="25" rx="5" fill="white"/><text x="325.0" y="1258.0" text-anchor="middle" font-size="16" fill="#3265B3">C6 emit返回后继续</text><polyline points="325.0,1445 325.0,1595" fill="none" stroke="#3265B3" stroke-width="2.8" stroke-linejoin="round"/><polygon points="325.0,1595 330.0,1583.0 320.0,1583.0" fill="#3265B3"/><rect x="249.0" y="1505.0" width="152" height="25" rx="5" fill="white"/><text x="325.0" y="1523.0" text-anchor="middle" font-size="16" fill="#3265B3">C7 Loop返回后收尾</text><polyline points="610,1135.0 830,1135.0" fill="none" stroke="#16816D" stroke-width="2.8" stroke-linejoin="round" stroke-dasharray="9 6"/><polygon points="830,1135.0 818.0,1130.0 818.0,1140.0" fill="#16816D"/><rect x="647.0" y="1080" width="136" height="25" rx="5" fill="white"/><text x="715" y="1098" text-anchor="middle" font-size="16" fill="#16816D">D2 turn.started</text><polyline points="610,1382.5 720,1382.5 720,1135 830,1135.0" fill="none" stroke="#16816D" stroke-width="2.8" stroke-linejoin="round" stroke-dasharray="9 6"/><polygon points="830,1135.0 818.0,1130.0 818.0,1140.0" fill="#16816D"/><rect x="656.0" y="1245" width="128" height="25" rx="5" fill="white"/><text x="720" y="1263" text-anchor="middle" font-size="16" fill="#16816D">D3 model.delta</text><polyline points="610,1657.5 1260,1657.5 1260,1135 1240,1135.0" fill="none" stroke="#16816D" stroke-width="2.8" stroke-linejoin="round" stroke-dasharray="9 6"/><polygon points="1240,1135.0 1252.0,1140.0 1252.0,1130.0" fill="#16816D"/><rect x="1058.0" y="1642.5" width="144" height="25" rx="5" fill="white"/><text x="1130" y="1660.5" text-anchor="middle" font-size="16" fill="#16816D">D4 turn.finished</text><polyline points="1035.0,1190 1035.0,1425" fill="none" stroke="#16816D" stroke-width="2.8" stroke-linejoin="round" stroke-dasharray="9 6"/><polygon points="1035.0,1425 1040.0,1413.0 1030.0,1413.0" fill="#16816D"/><rect x="979.0" y="1292.5" width="112" height="25" rx="5" fill="white"/><text x="1035.0" y="1310.5" text-anchor="middle" font-size="16" fill="#16816D">D5 逐个Event</text><rect x="40" y="155" width="570" height="110" rx="55.0" fill="#FFF4EA" stroke="#DFA471" stroke-width="2"/><text x="325.0" y="204.0" text-anchor="middle" font-size="22" font-weight="600" fill="#20324A">KakiApp.submit_text(text)</text><text x="325.0" y="231.0" text-anchor="middle" font-size="22" font-weight="600" fill="#20324A">先调用submit，再调用watch_turn</text><rect x="40" y="385" width="570" height="110" rx="16" fill="#FFF4EA" stroke="#DFA471" stroke-width="2"/><text x="325.0" y="434.0" text-anchor="middle" font-size="22" font-weight="600" fill="#20324A">Runtime.submit(text)</text><text x="325.0" y="461.0" text-anchor="middle" font-size="22" font-weight="600" fill="#20324A">同步检查 → create_task(_turn)</text><polygon points="64,615 586,615 610,670.0 586,725 64,725 40,670.0" fill="#F4F0FC" stroke="#AB98D2" stroke-width="2"/><text x="325.0" y="664.0" text-anchor="middle" font-size="22" font-weight="600" fill="#20324A">Runtime.active = Task</text><text x="325.0" y="691.0" text-anchor="middle" font-size="22" font-weight="600" fill="#20324A">事件循环推进Runtime._turn</text><rect x="830" y="615" width="410" height="140" rx="16" fill="#F4F6F8" stroke="#AAB5C2" stroke-width="2"/><text x="1035.0" y="653.5" text-anchor="middle" font-size="22" font-weight="600" fill="#20324A">watch_turn(task)</text><text x="1035.0" y="680.5" text-anchor="middle" font-size="22" font-weight="600" fill="#20324A">@work → await task</text><text x="1035.0" y="707.5" text-anchor="middle" font-size="22" font-weight="600" fill="#20324A">仅等待与处理异常</text><text x="1035.0" y="735.5" text-anchor="middle" font-size="16" fill="#63758C">Task结束后才恢复</text><rect x="40" y="862" width="570" height="86" fill="#F4F0FC" stroke="#AB98D2" stroke-width="2"/><ellipse cx="325.0" cy="862" rx="285.0" ry="12" fill="#F4F0FC" stroke="#AB98D2" stroke-width="2"/><path d="M40,948 A285.0,12 0 0 0 610,948" fill="#F4F0FC" stroke="#AB98D2" stroke-width="2"/><text x="325.0" y="899.0" text-anchor="middle" font-size="22" font-weight="600" fill="#20324A">_turn → Store.accept_turn</text><text x="325.0" y="926.0" text-anchor="middle" font-size="22" font-weight="600" fill="#20324A">SQL提交 → turn_id / user / created</text><rect x="40" y="1080" width="570" height="110" rx="16" fill="#F4F0FC" stroke="#AB98D2" stroke-width="2"/><text x="325.0" y="1129.0" text-anchor="middle" font-size="22" font-weight="600" fill="#20324A">_turn → Runtime.emit</text><text x="325.0" y="1156.0" text-anchor="middle" font-size="22" font-weight="600" fill="#20324A">turn.started（模型调用前）</text><rect x="40" y="1320" width="570" height="125" rx="16" fill="#F4F0FC" stroke="#AB98D2" stroke-width="2"/><text x="325.0" y="1376.5" text-anchor="middle" font-size="22" font-weight="600" fill="#20324A">快照 / 历史 → AgentLoop / Provider</text><text x="325.0" y="1403.5" text-anchor="middle" font-size="22" font-weight="600" fill="#20324A">on_delta → emit(model.delta)</text><rect x="40" y="1595" width="570" height="125" rx="62.5" fill="#EEF8F4" stroke="#76AF9A" stroke-width="2"/><text x="325.0" y="1651.5" text-anchor="middle" font-size="22" font-weight="600" fill="#20324A">_turn finally → finish_turn</text><text x="325.0" y="1678.5" text-anchor="middle" font-size="22" font-weight="600" fill="#20324A">emit(turn.finished) → 返回结果</text><rect x="830" y="1092" width="410" height="86" fill="#FFF4EA" stroke="#DFA471" stroke-width="2"/><ellipse cx="1035.0" cy="1092" rx="205.0" ry="12" fill="#FFF4EA" stroke="#DFA471" stroke-width="2"/><path d="M830,1178 A205.0,12 0 0 0 1240,1178" fill="#FFF4EA" stroke="#DFA471" stroke-width="2"/><text x="1035.0" y="1129.0" text-anchor="middle" font-size="22" font-weight="600" fill="#20324A">KakiApp.enqueue(Event)</text><text x="1035.0" y="1156.0" text-anchor="middle" font-size="22" font-weight="600" fill="#20324A">event_queue.put</text><rect x="830" y="1425" width="410" height="125" rx="16" fill="#FFF4EA" stroke="#DFA471" stroke-width="2"/><text x="1035.0" y="1468.0" text-anchor="middle" font-size="22" font-weight="600" fill="#20324A">consume_events → 分派</text><text x="1035.0" y="1495.0" text-anchor="middle" font-size="22" font-weight="600" fill="#20324A">phase / pending</text><text x="1035.0" y="1522.0" text-anchor="middle" font-size="22" font-weight="600" fill="#20324A">flush_tokens → Textual</text></svg>